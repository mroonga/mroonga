repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint
        language: system
        entry: |
          rake lint
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v18.1.4"
    hooks:
      - id: clang-format
        files: >-
          (
          ?ha_mroonga\.cpp|
          ?ha_mroonga\.hpp|
          ?lib/mrn_column_name\.cpp|
          ?lib/mrn_column_name\.hpp|
          ?lib/mrn_condition_converter\.cpp|
          ?lib/mrn_database\.cpp|
          ?lib/mrn_database_manager\.cpp|
          ?lib/mrn_grn\.hpp|
          ?lib/mrn_index_column_name\.cpp|
          ?lib/mrn_index_column_name\.hpp|
          ?lib/mrn_multiple_column_key_codec\.cpp|
          ?lib/mrn_operations\.cpp|
          ?lib/mrn_parameters_parser\.cpp|
          ?lib/mrn_parameters_parser\.hpp|
          ?mrn_mysql_compat\.h|
          ?mrn_table\.cpp|
          ?mrn_table\.hpp|
          ?udf/mrn_udf_command\.cpp|
          ?udf/mrn_udf_normalize\.cpp|
          ?udf/mrn_udf_snippet_html\.cpp|
          )
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: "0.29.1"
    hooks:
      - id: gersemi
